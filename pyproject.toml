[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-forecasting"
version = "0.1.0"
description = "Enterprise-ready forecasting service for SPM process data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SPM Forecasting" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
rag = ["openai>=1.0"]
dev = [
    "bandit>=1.7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.30,<1",
]

[project.scripts]
spm-forecast = "spm_forecasting.cli:main"
spm-demo = "spm_forecasting.interfaces.mock_demo:main"
spm-rag = "spm_forecasting.interfaces.rag_cli:main"
spm-mock-api = "spm_forecasting.interfaces.mock_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
