[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spm-forecasting"
version = "0.1.0"
description = "Enterprise-ready forecasting service for SPM process data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SPM Forecasting" }]
dependencies = []

[project.optional-dependencies]
dev = ["bandit>=1.7", "pip-audit>=2.7", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spm-forecast = "spm_forecasting.cli:main"
spm-demo = "spm_forecasting.interfaces.mock_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]